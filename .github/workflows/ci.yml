name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-dotnet-example }
      # Camada is a ProjectReference to the sibling checkout; the SDK vendors its own beacon build.
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-dotnet, path: camada-dotnet }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: camada-dotnet-example/global.json }
      - run: dotnet format --verify-no-changes CamadaExample.csproj && dotnet format --verify-no-changes tests/CamadaExample.Tests
        working-directory: camada-dotnet-example
      - run: dotnet build -warnaserror
        working-directory: camada-dotnet-example
      - run: dotnet test tests/CamadaExample.Tests
        working-directory: camada-dotnet-example
